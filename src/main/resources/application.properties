spring.application.name=text2cypher
server.port=8081
spring.config.import = env.properties
neo4j.uri=${DB_URL}
neo4j.username=${DB_USERNAME}
neo4j.password=${DB_PASSWORD}
neo4j.db=${DB_NAME}
local.api.url=${LOCAL_API_URL}
groq.api.url=${GROQ_API_URL}
groq.api.key1=${GROQ_API_KEY1}
groq.api.key2=${GROQ_API_KEY2}
groq.api.key3=${GROQ_API_KEY3}
groq.api.key4=${GROQ_API_KEY4}
groq.api.key5=${GROQ_API_KEY5}
groq.api.key6=${GROQ_API_KEY6}
groq.api.key7=${GROQ_API_KEY7}
groq.api.key8=${GROQ_API_KEY8}
groq.api.timeout=30000

spring.datasource.url= jdbc:postgresql://${LOCAL_DB_URL}?useUnicode=yes&characterEncoding=UTF-8&characterSetResults=UTF-8
spring.datasource.username=${LOCAL_DB_USER}
spring.datasource.password=${LOCAL_DB_PASS}
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show_sql=false
spring.jpa.properties.hibernate.format_sql=true